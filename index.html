<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TicketPass - Event QR Ticket Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-6 flex flex-col items-center">
  <div class="max-w-md w-full bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-2xl mt-6 text-center">
    <div class="w-12 h-12 rounded-xl bg-purple-600/20 text-purple-400 mx-auto flex items-center justify-center text-xl mb-3">
      <i class="fa-solid fa-qrcode"></i>
    </div>
    <h1 class="text-xl font-bold text-white">Event Ticket & QR Pass</h1>
    <p class="text-xs text-slate-400 mt-1">Global Tech Summit 2026</p>

    <!-- Ticket Badge Card -->
    <div class="mt-6 p-5 rounded-2xl bg-gradient-to-br from-purple-900/60 to-indigo-950 border border-purple-500/30 text-left">
      <div class="flex justify-between items-center text-xs text-purple-300 font-bold mb-4">
        <span>VIP ALL-ACCESS PASS</span>
        <span>#TK-89421</span>
      </div>
      <h3 class="text-lg font-extrabold text-white">Shahabuddin Mahar</h3>
      <p class="text-xs text-slate-400">Software Engineer & Creator</p>

      <div class="mt-6 pt-4 border-t border-purple-500/20 flex items-center justify-between">
        <div>
          <span class="text-[10px] text-slate-400 block">Date & Venue</span>
          <strong class="text-xs text-white">Nov 15, 2026 • Main Hall</strong>
        </div>
        <div class="w-12 h-12 bg-white rounded-lg p-1 flex items-center justify-center">
          <i class="fa-solid fa-qrcode text-black text-2xl"></i>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
